[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diagnex-backend"
version = "0.1.0"
description = "Diagnex API Backend"
authors = [{ name = "Diagnex Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "asyncpg",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "email-validator",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "celery",
    "redis",
    "scikit-learn",
    "joblib",
    "numpy",
    "supabase>=2.3.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "black",
    "isort",
    "pandas",
    "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
