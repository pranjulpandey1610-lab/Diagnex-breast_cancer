services:
  backend:
    build: ./backend
    env_file: .env.production
    restart: unless-stopped
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 30s, timeout: 5s, retries: 3 }
  frontend:
    build: ./frontend
    env_file: .env.production
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 30s, timeout: 5s, retries: 3 }
  celery_worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file: .env.production
    depends_on: { redis: { condition: service_healthy } }
    restart: unless-stopped
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [backend, frontend]
    restart: unless-stopped
