version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: diagnex-postgres
    environment:
      POSTGRES_DB: diagnex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: diagnex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  orthanc:
    image: jodogne/orthanc-plugins:1.12.4
    container_name: diagnex-orthanc
    environment:
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"orthanc":"${ORTHANC_PASSWORD:-change-me}"}'
      ORTHANC__DICOM_WEB__ENABLE: "true"
      ORTHANC__DICOM_WEB__ROOT: /dicom-web/
      ORTHANC__REMOTE_ACCESS_ALLOWED: "false"
    volumes:
      - orthanc_data:/var/lib/orthanc/db
    ports:
      - "127.0.0.1:8042:8042"

  ohif:
    image: ohif/viewer:v3.8.3
    container_name: diagnex-ohif
    environment:
      APP_CONFIG: '{"servers":{"dicomWeb":[{"name":"Diagnex Orthanc","wadoUriRoot":"http://orthanc:8042/dicom-web","qidoRoot":"http://orthanc:8042/dicom-web","wadoRoot":"http://orthanc:8042/dicom-web"}]}}'
    ports:
      - "127.0.0.1:3001:80"
    depends_on:
      - orthanc

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diagnex-backend
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diagnex-celery-worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diagnex-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  orthanc_data:
