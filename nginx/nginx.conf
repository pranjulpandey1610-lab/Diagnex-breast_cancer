events {}
http {
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=uploads:10m rate=5r/m;
  server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;
    # Enable only after a TLS certificate is configured:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location /api/ { limit_req zone=api burst=10 nodelay; proxy_pass http://backend:8000; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Host $host; }
    location /api/v1/reports { limit_req zone=uploads burst=3 nodelay; proxy_pass http://backend:8000; }
    location / { proxy_pass http://frontend:3000; proxy_set_header Host $host; }
  }
}
